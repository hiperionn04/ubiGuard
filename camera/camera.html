<!DOCTYPE html>
<html>

<head>
    <title>Camera Node</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 24px;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #222;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #444;
            transition: background 0.3s;
        }

        .dot.streaming {
            background: #48bb78;
            box-shadow: 0 0 6px #48bb7888;
        }

        .dot.waiting {
            background: #ed8933;
            box-shadow: 0 0 6px #ed893388;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        h1 {
            font-size: 14px;
            font-weight: normal;
            letter-spacing: 0.1em;
            color: #888;
            text-transform: uppercase;
        }

        .status-bar {
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 16px;
        }

        .status-bar span {
            color: #e0e0e0;
        }

        video {
            width: 100%;
            max-width: 480px;
            border-radius: 6px;
            border: 1px solid #222;
            background: #111;
            display: block;
            margin-bottom: 16px;
        }

        #log {
            font-size: 11px;
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            padding: 12px;
            max-height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #555;
            line-height: 1.6;
        }

        #log .ok {
            color: #48bb78;
        }

        #log .err {
            color: #e53e3e;
        }

        #log .info {
            color: #4299e1;
        }

        #log .warn {
            color: #ed8933;
        }
    </style>
</head>

<body>

    <header>
        <div class="dot" id="dot"></div>
        <h1>Camera Node — Smart Alarm</h1>
    </header>

    <div class="status-bar">State: <span id="statusText">Idle — awaiting alarm</span></div>

    <video id="myVideo" autoplay muted playsinline></video>
    <pre id="log"></pre>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, off }
            from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
        import { getAuth, signInAnonymously }
            from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyCbJfW3gm__QdLmhPTmgI9gl0-8hKDW6yU",
            authDomain: "ubiguard-sim.firebaseapp.com",
            databaseURL: "https://ubiguard-sim-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "ubiguard-sim",
        });
        const db = getDatabase(app);
        const auth = getAuth(app);

        const ALARM_UID = "alarm_3076F5F04D70";
        const basePath = `/alarms/${ALARM_UID}`;

        const paths = {
            isFired: `${basePath}/isFired`,
            streamRequested: `${basePath}/webrtc/streamRequested`,
            offer: `${basePath}/webrtc/offer`,
            answer: `${basePath}/webrtc/answer`,
            callerCandidates: `${basePath}/webrtc/callerCandidates`,
            viewerCandidates: `${basePath}/webrtc/viewerCandidates`,
        };

        const iceServers = {
            iceServers: [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:global.relay.metered.ca:80", username: "8925165006e017a481028666", credential: "agRZH6av4wFPruzm" },
                { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "8925165006e017a481028666", credential: "agRZH6av4wFPruzm" },
                { urls: "turn:global.relay.metered.ca:443", username: "8925165006e017a481028666", credential: "agRZH6av4wFPruzm" },
                { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "8925165006e017a481028666", credential: "agRZH6av4wFPruzm" },
            ]
        };

        const videoEl = document.getElementById('myVideo');
        const statusText = document.getElementById('statusText');
        const dotEl = document.getElementById('dot');
        const logEl = document.getElementById('log');

        let localStream = null;
        let pc = null;
        let alarmActive = false;

        function log(msg, type = 'info') {
            const ts = new Date().toLocaleTimeString();
            const span = document.createElement('span');
            span.className = type;
            span.textContent = `[${ts}] ${msg}\n`;
            logEl.appendChild(span);
            logEl.scrollTop = logEl.scrollHeight;
        }

        await signInAnonymously(auth);
        log('Signed in anonymously ✅', 'ok');

        onValue(ref(db, paths.isFired), (snap) => {
            alarmActive = snap.val() === true;
            if (alarmActive) {
                dotEl.className = 'dot waiting';
                statusText.textContent = 'Alarm active — waiting for viewer to open stream';
                log('Alarm fired — standby for stream request', 'warn');
            } else {
                dotEl.className = 'dot';
                statusText.textContent = 'Idle — awaiting alarm';
                log('Alarm cleared — stopping stream', 'info');
                stopAll();
            }
        });

        onValue(ref(db, paths.streamRequested), async (snap) => {
            if (snap.val() === true && alarmActive) {
                log('Viewer opened stream — starting camera', 'ok');
                dotEl.className = 'dot streaming';
                statusText.textContent = 'Streaming live';
                await startWebRTC();
            } else if (!snap.val() && pc) {
                log('Stream closed by viewer', 'warn');
                stopWebRTC();
                if (alarmActive) {
                    dotEl.className = 'dot waiting';
                    statusText.textContent = 'Alarm active — waiting for viewer to open stream';
                }
            }
        });

        async function startWebRTC() {
            if (pc) { log('Already streaming — skipping', 'warn'); return; }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch (err) {
                log(`Camera access failed: ${err.message}`, 'err');
                return;
            }

            videoEl.srcObject = localStream;
            log('Local stream acquired', 'ok');

            pc = new RTCPeerConnection(iceServers);
            pc.oniceconnectionstatechange = () => log(`ICE: ${pc.iceConnectionState}`, 'info');
            pc.onconnectionstatechange = () => log(`Connection: ${pc.connectionState}`, 'info');

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, paths.callerCandidates), event.candidate.toJSON());
                    log(`ICE candidate sent: ${event.candidate.type}`, 'info');
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await set(ref(db, paths.offer), { type: offer.type, sdp: offer.sdp });
            log('Offer pushed — awaiting viewer answer...', 'info');

            const pendingCandidates = [];
            let remoteDescriptionSet = false;

            onChildAdded(ref(db, paths.viewerCandidates), (snap) => {
                if (!snap.val()) return;
                if (remoteDescriptionSet) {
                    pc.addIceCandidate(new RTCIceCandidate(snap.val()))
                        .catch(e => log(`addIceCandidate error: ${e.message}`, 'err'));
                } else {
                    pendingCandidates.push(snap.val());
                    log('Queued viewer ICE candidate', 'info');
                }
            });

            const answerRef = ref(db, paths.answer);
            const unsubAnswer = onValue(answerRef, async (snap) => {
                if (!snap.val() || remoteDescriptionSet) return;
                if (pc.signalingState === 'stable') { log('Already stable — ignoring answer', 'warn'); return; }
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));
                    remoteDescriptionSet = true;
                    log('Remote description set ✅', 'ok');
                    for (const c of pendingCandidates) {
                        await pc.addIceCandidate(new RTCIceCandidate(c))
                            .catch(e => log(`addIceCandidate error: ${e.message}`, 'err'));
                    }
                    pendingCandidates.length = 0;
                    off(answerRef, 'value', unsubAnswer);
                } catch (err) {
                    log(`setRemoteDescription error: ${err.message}`, 'err');
                }
            });
        }

        function stopWebRTC() {
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (pc) { pc.close(); pc = null; }
            videoEl.srcObject = null;
            set(ref(db, `${basePath}/webrtc/offer`), null);
            set(ref(db, `${basePath}/webrtc/answer`), null);
            set(ref(db, `${basePath}/webrtc/callerCandidates`), null);
            set(ref(db, `${basePath}/webrtc/viewerCandidates`), null);
            log('WebRTC stopped and signalling cleared', 'info');
        }

        function stopAll() {
            stopWebRTC();
            set(ref(db, paths.streamRequested), null);
        }
    </script>
</body>

</html>
